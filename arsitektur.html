<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arsitektur Hybrid — HMTIF Career Hub</title>
  <link rel="icon" type="image/png" href="https://e.top4top.io/p_38813coj21.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <style>
    :root {
      --bg: #f8f6f6;
      --surface: #ffffff;
      --surface-soft: #f3eff0;
      --text: #241d20;
      --muted: #6e6268;
      --border: #e6dde0;
      --primary: #a61932;
      --primary-soft: rgba(166, 25, 50, .12);
      --success: #15803d;
      --warning: #d97706;
      --blue: #2453c0;
      --purple: #6d326b;
      --gold: #f0b72f;
      --shadow: 0 12px 32px rgba(24, 14, 18, .06);
    }
    [data-theme="dark"] {
      --bg: #151316;
      --surface: #211e22;
      --surface-soft: #2a252b;
      --text: #f0eaed;
      --muted: #b5a6ad;
      --border: #3b343a;
      --primary: #e04260;
      --primary-soft: rgba(224, 66, 96, .18);
      --success: #4ade80;
      --warning: #fbbf24;
      --blue: #60a5fa;
      --purple: #c084fc;
      --gold: #f6c959;
      --shadow: 0 14px 36px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px 40px;
      transition: background .25s ease, color .25s ease;
    }

    .wrap { max-width: 1040px; margin: 0 auto; }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img {
      width: 42px; height: 42px; object-fit: contain;
      background: #fff; border-radius: 11px; padding: 4px;
      border: 1px solid var(--border);
    }
    .brand small {
      display: block; font-size: .68rem; font-weight: 800;
      letter-spacing: .14em; color: var(--primary);
    }
    .brand h1 { margin: 0; font-size: clamp(1.15rem, 2.5vw, 1.5rem); font-weight: 800; }

    .header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-ghost {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: .18s ease;
    }
    .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .flow-tab {
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--muted);
      padding: 7px 13px;
      border-radius: 9px;
      font-family: inherit;
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
      transition: .18s ease;
    }
    .flow-tab:hover { color: var(--text); border-color: var(--primary); }
    .flow-tab.active {
      background: linear-gradient(125deg, #a61932, #d52b49);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 16px rgba(166, 25, 50, .25);
    }
    .hint { font-size: .75rem; color: var(--muted); font-weight: 600; }

    .svg-scroll { width: 100%; overflow-x: auto; padding-bottom: 6px; }
    svg { width: 100%; min-width: 720px; display: block; }

    @keyframes flowForward { to { stroke-dashoffset: -24; } }
    @keyframes flowBackward { to { stroke-dashoffset: 24; } }
    .edge-active-fwd { stroke-dasharray: 6 6; animation: flowForward 1s linear infinite; }
    .edge-active-bwd { stroke-dasharray: 6 6; animation: flowBackward 1s linear infinite; }
    .node-group { cursor: pointer; transition: opacity .2s ease; }
    .node-group:hover .node-box { stroke-width: 2.4; }

    .inspector {
      margin-top: 14px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .step-card {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 12px 14px;
    }
    .step-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .step-num {
      width: 22px; height: 22px; border-radius: 50%;
      background: linear-gradient(125deg, #a61932, #d52b49);
      color: #fff; font-size: .72rem; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
    }
    .step-title { font-size: .8rem; font-weight: 800; }
    .step-desc { margin: 0; font-size: .75rem; color: var(--muted); line-height: 1.5; }

    .detail-head {
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 10px; margin-bottom: 12px;
    }
    .detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .pill {
      padding: 3px 10px; border-radius: 999px;
      background: var(--primary-soft); color: var(--primary);
      font-size: .7rem; font-weight: 800;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .74rem; color: var(--muted); }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .detail-grid li {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: .78rem;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .steps-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .detail-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .steps-grid { grid-template-columns: 1fr; }
      .card { padding: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .edge-active-fwd, .edge-active-bwd { animation: none; }
    }
  </style>
</head>

        bullets: [
          '5 tabel: programs, news, daily_visits, ratings, hub_meta (< 1 MB dari 500 MB free tier).',
          'Keamanan RLS ketat: saran rahasia, kunjungan atomik, RPC admin khusus service_role.',
          'Arsip real-time zona waktu Asia/Jakarta (WIB) tepat pukul 00.00.'
        ]
      },
      github: {
        title: 'GitHub Pages (Hosting Web Statis)',
        badge: 'Frontend CDN',
        file: 'index.html & config.js',
        bullets: [
          'Live di https://hmtifub.github.io/careerhub/ dari repo hmtifUb/careerhub.',
          'Hanya memuat kunci publik sb_publishable_... (aman untuk repository publik).',
          'Cache lokal browser 2 menit, dark/light mode instan tanpa hit server ulang.'
        ]
      },
      user: {
        title: 'Mahasiswa / Pengunjung Web',
        badge: 'Client Browser',
        file: 'HP & Desktop',
        bullets: [
          'Filter, pencarian, favorit (localStorage), roll 4 kartu bergantian, & share WhatsApp.',
          'Grafik kunjungan 7/30/90 hari, Berita & Pengumuman, serta form rating kepuasan.',
          'Navigasi Scroll Progress Bar, Radial Sidebar, dan efek elevator scroll-reveal.'
        ]
      },
      email: {
        title: 'Notifikasi Email Pengelola',
        badge: 'MailApp',
        file: 'pullNewFeedbackFromSupabase()',
        bullets: [
          'Otomatis mengirim rating & saran baru ke email pengelola tiap siklus 5 menit.',
          'Menggunakan izin MailApp bawaan Google (gratis hingga 100 email/hari).',
          'Pengunjung tidak perlu menunggu proses kirim email saat submit rating di web.'
        ]
      }
    };

    let activeFlow = 'overview';
    let selectedNode = null;

    function render() {
      const flow = FLOWS[activeFlow];
      document.querySelectorAll('.flow-tab').forEach(btn => {
        const key = btn.dataset.flow;
        btn.textContent = FLOWS[key].tab;
        btn.classList.toggle('active', key === activeFlow);
      });

      document.getElementById('flow-summary-banner').textContent = flow.banner;

      ['edge-sheets-gas', 'edge-gas-supa', 'edge-supa-gas', 'edge-supa-web', 'edge-web-user', 'edge-gas-mail'].forEach(id => {
        const el = document.getElementById(id);
        el.setAttribute('stroke', 'var(--border)');
        el.setAttribute('stroke-width', '1.5');
        el.removeAttribute('marker-end');
        el.removeAttribute('marker-start');
        el.classList.remove('edge-active-fwd', 'edge-active-bwd');
      });

      flow.edges.forEach(e => {
        const el = document.getElementById(e.id);
        if (!el) return;
        el.setAttribute('stroke', e.color);
        el.setAttribute('stroke-width', '2.5');
        if (e.both) {
          el.setAttribute('marker-start', `url(#${e.marker})`);
          el.setAttribute('marker-end', `url(#${e.marker})`);
          el.classList.add('edge-active-fwd');
        } else if (e.dir === 'bwd') {
          el.setAttribute('marker-start', `url(#${e.marker})`);
          el.classList.add('edge-active-bwd');
        } else {
          el.setAttribute('marker-end', `url(#${e.marker})`);
          el.classList.add('edge-active-fwd');
        }
      });

      document.querySelectorAll('.node-group').forEach(g => {
        const key = g.dataset.node;
        const inFlow = flow.nodes.includes(key);
        const isSel = selectedNode === key;
        g.style.opacity = inFlow || isSel ? '1' : '0.35';
        const box = g.querySelector('.node-box');
        if (box) {
          box.setAttribute('stroke', isSel ? 'var(--primary)' : 'var(--border)');
          box.setAttribute('stroke-width', isSel ? '2.6' : '1.5');
        }
      });

      const panel = document.getElementById('inspector-panel');
      if (selectedNode && NODE_DETAILS[selectedNode]) {
        const info = NODE_DETAILS[selectedNode];
        panel.innerHTML = `
          <div class="detail-head">
            <div class="detail-meta">
              <strong>${info.title}</strong>
              <span class="pill">${info.badge}</span>
              <span class="mono">${info.file}</span>
            </div>
            <button type="button" class="btn-ghost" id="close-node-btn">← Kembali ke Alur</button>
          </div>
          <ul class="detail-grid">
            ${info.bullets.map(b => `<li>${b}</li>`).join('')}
          </ul>
        `;
        document.getElementById('close-node-btn').addEventListener('click', () => {
          selectedNode = null;
          render();
        });
      } else {
        panel.innerHTML = `
          <div class="steps-grid">
            ${flow.steps.map(s => `
              <div class="step-card">
                <div class="step-head">
                  <span class="step-num">${s.n}</span>
                  <span class="step-title">${s.title}</span>
                </div>
                <p class="step-desc">${s.desc}</p>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    document.querySelectorAll('.flow-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFlow = btn.dataset.flow;
        selectedNode = null;
        render();
      });
    });

    document.querySelectorAll('.node-group').forEach(g => {
      g.addEventListener('click', () => {
        selectedNode = selectedNode === g.dataset.node ? null : g.dataset.node;
        render();
      });
    });

    // Sinkron dengan preferensi dark mode Career Hub
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (_) {}

    document.getElementById('theme-btn').addEventListener('click', () => {
      const dark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (dark) {
        document.documentElement.removeAttribute('data-theme');
        try { localStorage.setItem('theme', 'light'); } catch (_) {}
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        try { localStorage.setItem('theme', 'dark'); } catch (_) {}
      }
    });

    render();
  </script>
</body>
</html>
